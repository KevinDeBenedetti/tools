name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@main

  ci-docs:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-docs.yml@main
    with:
      link-check-paths: 'docs/**/*.md'

  security:
    needs: [ci, ci-docs]
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    with:
      run-node-audit: true
      run-python-audit: false
      run-secret-scan: true
      run-codeql: false
    secrets: inherit

  bot-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: KevinDeBenedetti/github-workflows/.github/workflows/check-bot-commits.yml@main

  dispatch:
    name: Dispatch docs rebuild
    needs: [ci, ci-docs, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/dispatch-docs.yml@main
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
