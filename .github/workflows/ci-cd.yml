name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@main
    with:
      run-link-check: true
      link-check-paths: 'docs/'

  security:
    needs: [ci]
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    with:
      run-node-audit: true
      run-python-audit: false
      run-secret-scan: true
      # CodeQL disabled: No TypeScript/JavaScript SAST needed for tools management (use linter + typecheck)
      run-codeql: false

  bot-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: KevinDeBenedetti/github-workflows/.github/workflows/check-bot-commits.yml@main

  dispatch:
    name: Dispatch docs rebuild
    needs: [ci, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@main
    with:
      app-id: ${{ vars.DOCS_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
