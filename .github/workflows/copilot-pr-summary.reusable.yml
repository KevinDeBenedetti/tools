name: Copilot PR Summary (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Copilot model to use
        type: string
        default: gpt-5-mini
      branches:
        description: Comma-separated list of base branches to run on (informational only — filtering is done by the caller)
        type: string
        default: main
    secrets:
      COPILOT_TOKEN:
        description: >
          OAuth user access token (gho_ prefix) from a GitHub account with an
          active Copilot Individual or Business subscription.
          Obtain it by running: gh auth login && gh auth token
        required: false

# Minimal permissions: read code, write PR comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    name: Summarize PR with Copilot
    runs-on: ubuntu-latest

    env:
      MODEL: ${{ inputs.model }}

    steps:
      - name: Check token availability
        id: check
        run: |
          if [ -z "${{ secrets.COPILOT_TOKEN }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ COPILOT_TOKEN is not set — skipping summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout calling repo
        if: steps.check.outputs.available == 'true'
        uses: actions/checkout@v4

      # ── Generate PR summary via Copilot SDK ────────────────────────────────
      - name: Generate PR summary
        if: steps.check.outputs.available == 'true'
        id: copilot
        # Reference the action from the tools repo so it works when called externally
        uses: KevinDeBenedetti/tools/.github/actions/copilot@main
        with:
          tool: generate
          token: ${{ secrets.COPILOT_TOKEN }}
          model: ${{ env.MODEL }}
          options: '{"type":"summary","format":"markdown"}'

      # ── Write summary to a temp file (avoids shell quoting issues) ─────────
      - name: Write summary to file
        if: steps.copilot.outputs.success == 'true'
        env:
          GENERATED: ${{ steps.copilot.outputs.generated }}
        run: |
          cat > /tmp/pr-summary.md <<'MARKDOWN_EOF'
          ## 🤖 Copilot PR Summary

          MARKDOWN_EOF
          echo "$GENERATED" >> /tmp/pr-summary.md
          cat >> /tmp/pr-summary.md <<'MARKDOWN_EOF'

          ---
          *Generated by [Copilot Tools](https://github.com/${{ github.repository }}) &nbsp;·&nbsp; Model: ${{ env.MODEL }}*
          MARKDOWN_EOF

      # ── Post or update the PR comment ─────────────────────────────────────
      - name: Post summary comment
        if: steps.copilot.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          EXISTING=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '.comments[] | select(.body | startswith("## 🤖 Copilot PR Summary")) | .databaseId' \
            2>/dev/null | head -1 || true)

          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$EXISTING" || true
          fi

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-summary.md

      # ── Surface the summary in the Actions UI (always visible) ────────────
      - name: Write job summary
        if: steps.copilot.outputs.success == 'true'
        run: cat /tmp/pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      # ── Fail clearly if Copilot errored ───────────────────────────────────
      - name: Report failure
        if: steps.copilot.outputs.success == 'false'
        run: |
          echo "❌ Copilot generate failed: ${{ steps.copilot.outputs.summary }}"
          exit 1
