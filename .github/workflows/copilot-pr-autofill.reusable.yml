name: Copilot PR Template Auto-fill (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Copilot model to use
        type: string
        default: gpt-5-mini
    secrets:
      COPILOT_TOKEN:
        description: >
          OAuth user access token (gho_ prefix) from a GitHub account with an
          active Copilot Individual or Business subscription.
          Obtain it by running: gh auth login && gh auth token
        required: true

# Minimal permissions: read code, write PR comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-autofill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofill:
    name: Auto-fill PR template with Copilot
    runs-on: ubuntu-latest

    env:
      MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      # ── Generate PR template suggestions via Copilot SDK ──────────────────
      - name: Generate template suggestions
        id: copilot
        # Reference the action from the tools repo so it works when called externally
        uses: YOUR_ORG/tools/.github/actions/copilot@main
        with:
          tool: generate
          token: ${{ secrets.COPILOT_TOKEN }}
          model: ${{ env.MODEL }}
          options: '{"type":"template"}'

      # ── Write suggestions to a temp file (avoids shell quoting issues) ────
      - name: Write suggestions to file
        if: steps.copilot.outputs.success == 'true'
        env:
          GENERATED: ${{ steps.copilot.outputs.generated }}
        run: |
          echo "$GENERATED" > /tmp/pr-autofill.md
          cat >> /tmp/pr-autofill.md <<'MARKDOWN_EOF'

          ---
          *Generated by [Copilot Tools](https://github.com/${{ github.repository }}) &nbsp;·&nbsp; Model: ${{ env.MODEL }}*
          MARKDOWN_EOF

      # ── Delete previous bot comment and post new one ───────────────────────
      - name: Post template suggestions
        if: steps.copilot.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          EXISTING=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '.comments[] | select(.body | startswith("## 🤖 Copilot PR Auto-fill")) | .databaseId' \
            2>/dev/null | head -1 || true)

          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$EXISTING" || true
          fi

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-autofill.md

      # ── Surface the suggestions in the Actions UI (always visible) ────────
      - name: Write job summary
        if: steps.copilot.outputs.success == 'true'
        run: cat /tmp/pr-autofill.md >> "$GITHUB_STEP_SUMMARY"

      # ── Fail clearly if Copilot errored ───────────────────────────────────
      - name: Report failure
        if: steps.copilot.outputs.success == 'false'
        run: |
          echo "❌ Copilot generate failed: ${{ steps.copilot.outputs.summary }}"
          exit 1
