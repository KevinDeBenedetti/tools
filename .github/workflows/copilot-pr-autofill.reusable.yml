name: Copilot PR Template Auto-fill (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Copilot model to use
        type: string
        default: gpt-5-mini
    secrets:
      COPILOT_TOKEN:
        description: >
          OAuth user access token (gho_ prefix) from a GitHub account with an
          active Copilot Individual or Business subscription.
          Obtain it by running: gh auth login && gh auth token
        required: false

# Minimal permissions: read code, write PR body and comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-autofill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofill:
    name: Auto-fill PR template with Copilot
    runs-on: ubuntu-latest

    env:
      MODEL: ${{ inputs.model }}

    steps:
      - name: Check token availability
        id: check
        run: |
          if [ -z "${{ secrets.COPILOT_TOKEN }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ COPILOT_TOKEN is not set — skipping autofill." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout calling repo
        if: steps.check.outputs.available == 'true'
        uses: actions/checkout@v4

      # ── Generate PR template suggestions via Copilot SDK ──────────────────
      - name: Generate template suggestions
        if: steps.check.outputs.available == 'true'
        id: copilot
        # Reference the action from the tools repo so it works when called externally
        uses: KevinDeBenedetti/tools/.github/actions/copilot@main
        with:
          tool: generate
          token: ${{ secrets.COPILOT_TOKEN }}
          model: ${{ env.MODEL }}
          options: '{"type":"template"}'

      # ── Update PR body directly when a PR template was found ──────────────
      - name: Update PR body
        if: steps.copilot.outputs.filledTemplate != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILLED: ${{ steps.copilot.outputs.filledTemplate }}
        run: |
          echo "$FILLED" > /tmp/pr-body.md
          gh pr edit "${{ github.event.pull_request.number }}" --body-file /tmp/pr-body.md

      # ── Post confirmation comment after body update ────────────────────────
      - name: Post confirmation comment
        if: steps.copilot.outputs.filledTemplate != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "🤖 **Copilot** has auto-filled the PR description based on your changes. Review and edit as needed. &nbsp;·&nbsp; Model: \`${{ env.MODEL }}\`"

      # ── Fallback: no template found — post structured suggestions ─────────
      - name: Write suggestions to file
        if: steps.copilot.outputs.success == 'true' && steps.copilot.outputs.filledTemplate == ''
        env:
          GENERATED: ${{ steps.copilot.outputs.generated }}
        run: |
          echo "$GENERATED" > /tmp/pr-autofill.md
          cat >> /tmp/pr-autofill.md <<'MARKDOWN_EOF'

          ---
          *Generated by [Copilot Tools](https://github.com/${{ github.repository }}) &nbsp;·&nbsp; Model: ${{ env.MODEL }}*
          MARKDOWN_EOF

      - name: Post suggestions comment
        if: steps.copilot.outputs.success == 'true' && steps.copilot.outputs.filledTemplate == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          EXISTING=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '.comments[] | select(.body | startswith("## 🤖 Copilot PR Auto-fill")) | .databaseId' \
            2>/dev/null | head -1 || true)

          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$EXISTING" || true
          fi

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-autofill.md

      # ── Surface the result in the Actions UI ──────────────────────────────
      - name: Write job summary
        if: steps.copilot.outputs.success == 'true'
        run: |
          if [ -f /tmp/pr-body.md ]; then
            echo "## ✅ PR body updated" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/pr-autofill.md ]; then
            cat /tmp/pr-autofill.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Fail clearly if Copilot errored ───────────────────────────────────
      - name: Report failure
        if: steps.copilot.outputs.success == 'false'
        run: |
          echo "❌ Copilot generate failed: ${{ steps.copilot.outputs.summary }}"
          exit 1
