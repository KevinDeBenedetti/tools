name: Copilot Tools
description: Run Copilot-backed review, analyze, generate, audit, or resume tools

inputs:
  tool:
    required: true
    description: 'review | analyze | generate | audit | resume'
  token:
    required: true
    description: GitHub token with Copilot access
  options:
    required: false
    description: JSON string of tool-specific options
    default: '{}'
  model:
    required: false
    description: Model ID passed to the Copilot client
    default: ''

outputs:
  summary:
    description: Tool execution summary
    value: ${{ steps.run.outputs.summary }}
  success:
    description: 'true | false'
    value: ${{ steps.run.outputs.success }}
  generated:
    description: Generated content (generate tool — type summary/docs/changelog/tests)
    value: ${{ steps.run.outputs.generated }}
  response:
    description: Copilot response text (resume tool)
    value: ${{ steps.run.outputs.response }}
  sessionId:
    description: Session ID used or created (resume tool)
    value: ${{ steps.run.outputs.sessionId }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: |
        ROOT_DIR="$(cd "${{ github.action_path }}/../../.." && pwd)"
        cd "$ROOT_DIR"
        bun install --frozen-lockfile

    - name: Run Copilot tool
      id: run
      shell: bash
      env:
        # SDK token priority: COPILOT_GITHUB_TOKEN > GH_TOKEN > GITHUB_TOKEN
        # Must be a token from an account with an active Copilot subscription.
        COPILOT_GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_TOOL: ${{ inputs.tool }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_MODEL: ${{ inputs.model }}
      run: |
        ROOT_DIR="$(cd "${{ github.action_path }}/../../.." && pwd)"
        cd "$ROOT_DIR"
        bun run src/index.ts
