inputs:
  tool:
    required: true
    description: 'review | analyze | generate | audit'
  token:
    required: true
    description: 'GitHub token with Copilot access'
  options:
    required: false
    description: 'JSON string of tool-specific options'
    default: '{}'

outputs:
  summary:
    description: 'Tool execution summary'
    value: ${{ steps.run.outputs.summary }}
  success:
    description: 'true | false'
    value: ${{ steps.run.outputs.success }}

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Run Copilot tool
      id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_TOOL: ${{ inputs.tool }}
        INPUT_OPTIONS: ${{ inputs.options }}
      run: bun run src/index.ts
