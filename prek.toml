#:schema https://www.schemastore.org/prek.json
# prek — Rust-native pre-commit hook runner (https://prek.j178.dev)
# Install hooks: bunx prek install
# Run manually:  bunx prek run --all-files | Update revs: prek auto-update

minimum_prek_version = "0.3.0"
fail_fast = false
default_install_hook_types = ["pre-commit", "pre-push"]

# ── Built-in hooks (Rust-native, zero setup) ──────────────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
]

# ── Local hooks (run bun/oxlint/oxfmt via system PATH) ────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "format"
name = "Format (oxfmt, auto-fix)"
entry = "bun run format"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint"
name = "Lint (oxlint, auto-fix)"
entry = "bun run lint:fix"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "TypeScript typecheck"
entry = "bun"
args = ["run", "typecheck"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "typecheck-tests"
name = "TypeScript typecheck (tests)"
entry = "bun"
args = ["run", "typecheck:tests"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "github-typecheck"
name = "GitHub CLI typecheck"
entry = "bun"
args = ["run", "github:typecheck"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "cli-typecheck"
name = "CLI typecheck"
entry = "bun"
args = ["run", "cli:typecheck"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "test"
name = "Tests (bun)"
entry = "bun"
args = ["test"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

# ── Shared hooks from github-workflows ────────────────────────────────────────
[[repos]]
repo = "https://github.com/KevinDeBenedetti/github-workflows"
rev = "v0.3.0"
hooks = [
  { id = "check-docs-links" },
  { id = "check-vitepress-md" },
]
