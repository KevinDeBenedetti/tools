#:schema https://www.schemastore.org/prek.json
# prek — Rust-native pre-commit hook runner (https://prek.j178.dev)
# Install hooks: bunx prek install
# Run manually:  bunx prek run --all-files

# ── Built-in hooks (Rust-native, zero setup) ──────────────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
]

# ── Local hooks (run bun/oxlint/oxfmt via system PATH) ────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "format"
name = "Format check (oxfmt)"
entry = "bun run format:check"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint"
name = "Lint (oxlint)"
entry = "bun run lint"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "TypeScript typecheck"
entry = "bash"
args = ["-c", "bun run github:typecheck && bun run todo:typecheck && bun x tsc --noEmit -p tsconfig.cli.json"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "test"
name = "Tests (bun)"
entry = "bun"
args = ["test", "src/tests/", "src/cli/"]
language = "system"
pass_filenames = false
stages = ["pre-push"]
